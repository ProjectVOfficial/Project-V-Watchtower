name: "Watchtower CodeQL"

# Scan canonical application/source code, not generated release copies or
# intentionally adversarial test fixtures. Production code remains fully in scope.
paths-ignore:
  - "tests/**"
  - "github-release-output/**"
  - "coverage/**"
  - "dist/**"
  - "node_modules/**"
  - "src/generated/**"
  - "**/*.test.*"
  - "playground-*.html"
