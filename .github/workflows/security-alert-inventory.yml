name: Security Alert Inventory

on:
  pull_request:
    paths:
      - ".github/workflows/security-alert-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inventory open CodeQL alerts on main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
              ...context.repo,
              state: 'open',
              ref: 'refs/heads/main',
              per_page: 100,
            });
            core.info(`OPEN_ALERT_COUNT=${alerts.length}`);
            for (const alert of alerts) {
              core.info(JSON.stringify({
                number: alert.number,
                rule: alert.rule?.id,
                description: alert.rule?.description,
                severity: alert.rule?.security_severity_level || alert.rule?.severity,
                path: alert.most_recent_instance?.location?.path,
                start_line: alert.most_recent_instance?.location?.start_line,
                state: alert.state,
              }));
            }
